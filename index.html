<!DOCTYPE html>

<html>
<head>
  <!-- <base href="/"> -->

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta -->

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="my_portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>my_portfolio</title>
  <link rel="manifest" href="manifest.json">

  <!-- 🔥 LOADING SCREEN STYLES -->

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    #loading {
      position: fixed;
      width: 100%;
      height: 100%;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .loader-container {
      text-align: center;
      animation: fadeIn 0.6s ease-in;
    }

    .logo {
      width: 70px;
      height: 70px;
      margin-bottom: 20px;
    }

    .title {
      font-size: 18px;
      font-weight: 600;
      margin-top: 20px;
    }

    .subtitle {
      font-size: 14px;
      color: #666;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #eee;
      border-top: 4px solid #2ecc71;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: auto;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>

</head>

<body>

  <!-- 🔥 LOADING SCREEN -->

  <div id="loading">
    <div class="loader-container">
      <img src="icons/Icon-192.png" class="logo" />
      <div class="spinner"></div>
      <p class="title">Loading your experience</p>
      <p class="subtitle">Please wait a moment...</p>
    </div>
  </div>

  <!-- ✅ Flutter bootstrap (CORRECT) -->

  <script src="flutter_bootstrap.js" async></script>

  <!-- ✅ REMOVE LOADER (MUST BE SEPARATE SCRIPT) -->

  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('loading');
      if (loader) {
        loader.style.transition = "opacity 0.4s ease";
        loader.style.opacity = "0";

        setTimeout(() => {
          loader.remove();
        }, 400);
      }
    });
  </script>

</body>
</html>
